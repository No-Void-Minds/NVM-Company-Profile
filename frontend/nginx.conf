upstream compro_backend {
  server backend:8082;
}

# Filled by auth_request from the X-Gate header of /api/gate. While the gate is on, every page
# is private and not indexed (FR-122), for a visitor who unlocked it as much as for one who did
# not, so Cloudflare and browsers never keep either version. An empty value adds no header.
map $gate_state $gate_cache_control {
  on "private, no-store";
  default "no-cache";
}

map $gate_state $gate_robots {
  on "noindex";
  default "";
}

# The password page in the language of the locked address (FR-123)
map $uri $password_page {
  ~^/en(/|$) /en/password/index.html;
  default /password/index.html;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # 8 MB upload limit in the backend, plus multipart overhead
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # The Cloudflare Tunnel runs on the host and reaches this container through
  # localhost:8092, so its requests arrive from the compose gateway. Only that
  # address may name the visitor. A LAN client on port 8092 keeps its own address,
  # and any CF-Connecting-IP it sends is ignored. The image fills the variable in
  # from the container environment (templates, envsubst) at start.
  set_real_ip_from ${COMPRO_GATEWAY_IP};
  real_ip_header CF-Connecting-IP;

  # $remote_addr is the visitor after real_ip. Replacing X-Forwarded-For instead of
  # appending stops clients from spoofing the address the rate limits are keyed on.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Asked before every locked request (FR-121). The visitor's cookies go along, so an
  # admin session opens the site. GET always, a POST to /api/gate would be a 404.
  location = /_gate {
    internal;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://compro_backend/api/gate;
  }

  # Never locked: health, the gate itself, and the admin API with its login
  location = /api/health {
    proxy_pass http://compro_backend;
  }

  location = /api/gate {
    proxy_pass http://compro_backend;
  }

  location /api/admin/ {
    proxy_pass http://compro_backend;
  }

  # Public API and uploaded photos lock with the site. The backend itself marks them
  # private and noindex while the gate is on.
  location /api/ {
    auth_request /_gate;
    error_page 401 = @api_locked;
    proxy_pass http://compro_backend;
  }

  location /media/ {
    auth_request /_gate;
    error_page 401 = @api_locked;
    proxy_pass http://compro_backend;
  }

  location @api_locked {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex" always;
    return 401 '{"error":{"code":"UNAUTHORIZED","message":"Situs sedang dikunci."}}';
  }

  # The backend answers these according to the gate (Disallow all, no sitemap)
  location = /sitemap.xml {
    proxy_pass http://compro_backend;
  }

  location = /robots.txt {
    proxy_pass http://compro_backend;
  }

  # Vite puts a content hash in these names
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Exact match, because the /brand page prerenders into this same folder
  location = /brand/nvm-logo.png {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Admin has its own login and is never locked. spa.html has no markup to hydrate.
  location /admin {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /spa.html =404;
  }

  # The password page, opened directly or as the answer for a locked address
  location ~ ^/(en/)?password(/|/index\.html)?$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex" always;
    try_files /$1password/index.html =404;
  }

  # Every other page waits for the gate. A 401 keeps its status and shows the password page.
  location / {
    auth_request /_gate;
    auth_request_set $gate_state $upstream_http_x_gate;
    error_page 401 $password_page;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $gate_cache_control;
    add_header X-Robots-Tag $gate_robots;
    try_files $uri $uri/index.html /spa.html;
  }
}
