upstream compro_backend {
  server backend:8082;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # 8 MB upload limit in the backend, plus multipart overhead
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Replacing X-Forwarded-For instead of appending stops clients from spoofing
  # the address that the rate limits are keyed on.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://compro_backend;
  }

  location /media/ {
    proxy_pass http://compro_backend;
  }

  location = /sitemap.xml {
    proxy_pass http://compro_backend;
  }

  location = /robots.txt {
    proxy_pass http://compro_backend;
  }

  # Vite puts a content hash in these names
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location /brand/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # spa.html has no markup to hydrate, so /admin and unknown paths mount cleanly
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /spa.html;
  }
}
