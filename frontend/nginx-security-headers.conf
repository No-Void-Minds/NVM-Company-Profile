# Included in each static location, because a location with its own add_header
# stops inheriting the ones from the server block.
# The sha256 is the inline theme script in index.html, checked by scripts/prerender.mjs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-c/8qZybQpEB0otx0cGVoTfe8NXr495Xx4cm9503eJTs='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
