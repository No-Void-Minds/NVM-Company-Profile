name: nvm-compro

services:
  backend:
    build: ../backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Also set in the image. Written here so /api/docs (Swagger UI, debug only) stays off.
      GIN_MODE: release
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL di deploy/.env}
      IP_HASH_SALT: ${IP_HASH_SALT:?isi IP_HASH_SALT di deploy/.env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?isi PUBLIC_BASE_URL di deploy/.env}
      BRAND_EST_YEAR: ${BRAND_EST_YEAR:-2021}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Nginx lives on this network, and only it may set X-Forwarded-For.
      TRUSTED_PROXIES: ${COMPRO_SUBNET:-172.30.92.0/24}
    volumes:
      - /srv/nvm-compro/media:/data/media
    networks:
      - compro
      - postgres

  frontend:
    build:
      context: ../frontend
      args:
        VITE_SHOPEE_URL: ${VITE_SHOPEE_URL:-}
        VITE_TIKTOK_SHOP_URL: ${VITE_TIKTOK_SHOP_URL:-}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-}
        # Same address as the sitemap, so canonical and hreflang agree with it
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?isi PUBLIC_BASE_URL di deploy/.env}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Must be the gateway set on the compro network below, see nginx.conf real_ip
      COMPRO_GATEWAY_IP: ${COMPRO_GATEWAY_IP:-172.30.92.1}
      # Only COMPRO_* is substituted, so nginx variables such as $remote_addr stay intact
      NGINX_ENVSUBST_FILTER: COMPRO_
    ports:
      - "8092:80"
    networks:
      - compro

networks:
  compro:
    ipam:
      config:
        - subnet: ${COMPRO_SUBNET:-172.30.92.0/24}
          # Explicit, because nginx trusts CF-Connecting-IP only from this address
          gateway: ${COMPRO_GATEWAY_IP:-172.30.92.1}
  postgres:
    external: true
    name: ${PG_NETWORK:?isi PG_NETWORK di deploy/.env}
