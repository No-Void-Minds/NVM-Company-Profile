          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/yaml:
              schema: { type: object, description: 'Spec ini.' }
            text/css:
              schema: { type: string }
            text/javascript:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: nvm_compro_sid
      description: Cookie sesi HttpOnly dari `POST /api/admin/login`, berlaku 8 jam sejak aktivitas terakhir.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Nilai `csrf_token` dari login atau `GET /api/admin/me`. Wajib untuk setiap mutasi admin.

  parameters:
    Lang:
      name: lang
      in: query
      description: Bahasa teks. Selain `id` dan `en` dijawab 400.
      schema: { $ref: '#/components/schemas/Lang' }
    SizeChartKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 80
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        examples: [aezy-regular]
    Id:
      name: id
      in: path
      required: true
      description: UUID. Nilai yang bukan UUID dijawab 404.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID yang dibuat browser sekali per isian formulir. Wajib bila `website` kosong.
      schema: { type: string, format: uuid }
    SessionCookieOptional:
      name: nvm_compro_sid
      in: cookie
      description: Sesi admin, bila ada.
      schema: { type: string }

  headers:
    NoStore:
      required: true
      schema: { type: string, const: no-store }
    PublicCache:
      required: true
      description: '`private, no-store` saat situs dikunci (FR-122).'
      schema:
        type: string
        enum: ['public, max-age=60', 'private, no-store']
    ErrorCache:
      required: true
      description: '`no-store` dari backend, `private, no-store` dari Nginx saat situs dikunci.'
      schema:
        type: string
        enum: [no-store, 'private, no-store']
    XGate:
      required: true
      description: Dibaca Nginx lewat `auth_request_set` untuk menandai halaman privat.
      schema: { type: string, enum: ['on', 'off'] }

  responses:
    Validation:
      description: Isian atau parameter tidak valid (`VALIDATION`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Belum masuk, sesi habis, atau username dan password salah (`UNAUTHORIZED`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: Situs dikunci halaman password. Dijawab Nginx, bukan backend (`UNAUTHORIZED`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
        X-Robots-Tag:
          schema: { type: string, const: noindex }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Header `X-CSRF-Token` tidak ada atau tidak cocok (`FORBIDDEN`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data atau alamat tidak ada (`NOT_FOUND`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Testimoni tayang tanpa konfirmasi blur (`CONFLICT`, BR-02).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Batas permintaan terlampaui (`RATE_LIMITED`).
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: Kesalahan server (`INTERNAL`). Detail hanya di log, dicari lewat header `X-Request-ID`.
      headers:
        Cache-Control: { $ref: '#/components/headers/ErrorCache' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Pesan untuk ditampilkan ke pengguna, dalam bahasa Indonesia.
            fields:
              type: object
              description: Pesan per field. Tidak ada bila error tidak menyangkut field tertentu.
              additionalProperties: { type: string }
    ErrorCode:
      type: string
      enum: [VALIDATION, NOT_FOUND, UNAUTHORIZED, FORBIDDEN, RATE_LIMITED, CONFLICT, INTERNAL]
    Lang:
      type: string
      enum: [id, en]
      default: id
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, down] }
    Session:
      type: object
      required: [username, csrf_token]
      properties:
        username: { type: string }
        csrf_token:
          type: string
          description: Dikirim kembali di header `X-CSRF-Token` untuk mutasi admin.
    TechLink:
      type: object
      required: [fit, url]
      properties:
        fit:
          type: [string, 'null']
          description: Salah satu `fits` dari tech, atau null untuk tech tanpa fit.
          examples: [Regular]
        url:
          type: string
          maxLength: 2048
          description: Kosong atau `https://shopee.co.id/...`, disimpan apa adanya.
          examples: ['https://shopee.co.id/No-Void-Minds-AEZY-Regular-T-Shirt-Core-i.462123491.25438116155']
    Tech:
      type: object
      required: [key, name, family, generation, needs, tagline, sub, description, chips, fits, technology_label, on_rack, visible, sort, links]
      properties:
        key: { type: string, description: 'Tanpa simbol merek dagang.', examples: [aezy] }
        name: { type: string, description: 'UI menambahkan simbol merek dagang di belakangnya.', examples: [AEZY] }
        family: { type: string, examples: [AEZY] }
        generation: { type: integer, examples: [1] }
        needs:
          type: array
          items: { type: string }
          examples: [[hot]]
        tagline: { type: string, examples: [Untuk hari-hari yang terasa gerah.] }
        sub: { type: string, examples: ['Performa, iklim, stretch'] }
        description: { type: string }
        chips:
          type: array
          items: { type: string }
          examples: [[Bernapas, Cepat kering, Lembut seperti udara, Pemulihan elastis]]
        fits:
          type: array
          items: { type: string }
          examples: [[Regular, Fitted, Polo]]
        technology_label: { type: string, examples: [Air feel technology] }
        on_rack: { type: boolean }
        visible:
          type: boolean
          description: Selalu true di `/api/techs`. Hanya `/api/admin/techs` yang memuat tech tersembunyi.
        sort: { type: integer }
        links:
          type: array
          description: Urut sesuai `fits`. Kombinasi tanpa link tidak ada di sini.
          items: { $ref: '#/components/schemas/TechLink' }
    Collab:
      type: object
      required: [key, name, available, sort, url]
      properties:
        key: { type: string }
        name: { type: string }
        available: { type: boolean, description: 'false berarti coming soon.' }
        sort: { type: integer }
        url:
          type: [string, 'null']
          description: Link koleksi Shopee, null bila belum diisi.
    LabStats:
      type: object
      required: [systems, on_rack, est_year]
      properties:
        systems: { type: integer, description: 'Jumlah tech yang tampil.' }
        on_rack: { type: integer, description: 'Jumlah tech tampil yang sedang on the rack.' }
        est_year: { type: integer, description: 'Dari `BRAND_EST_YEAR`.', examples: [2021] }
    Image:
      type: object
      required: [src, srcset, width, height]
      properties:
        src: { type: string, description: 'Varian 960 px.' }
        srcset: { type: string, description: 'Varian 480, 960, dan 1600 px.' }
        width: { type: integer, description: 'Lebar gambar asli.' }
        height: { type: integer }
    GalleryItem:
      type: object
      required: [id, category, alt, caption, image]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        alt: { type: string }
        caption: { type: string }
        image: { $ref: '#/components/schemas/Image' }
    AdminGalleryItem:
      allOf:
        - $ref: '#/components/schemas/GalleryItem'
        - type: object
          description: '`alt` dan `caption` selalu bahasa Indonesia.'
          required: [alt_en, caption_en, visible, sort, created_at]
          properties:
            alt_en: { type: string }
            caption_en: { type: string }
            visible: { type: boolean }
            sort: { type: integer }
            created_at: { type: string, format: date-time }
    TestimonialSource:
      type: string
      enum: [shopee, tiktok_shop]
    Testimonial:
      type: object
      required: [id, source, review_date, tech_key, rating, transcript, lang, image]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/TestimonialSource' }
        review_date: { type: string, format: date }
        tech_key: { type: [string, 'null'] }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        transcript: { type: string }
        lang:
          $ref: '#/components/schemas/Lang'
          description: Bahasa transkrip, tidak diterjemahkan.
        image: { $ref: '#/components/schemas/Image' }
    AdminTestimonial:
      allOf:
        - $ref: '#/components/schemas/Testimonial'
        - type: object
          required: [blurred_confirmed, published, created_at]
          properties:
            blurred_confirmed: { type: boolean }
            published: { type: boolean }
            created_at: { type: string, format: date-time }
    SizeChart:
      type: object
      required: [key, title, rows, note, updated_at]
      properties:
        key: { type: string, examples: [aezy-regular] }
        title: { type: string, examples: [AEZY Regular T-Shirt] }
        rows:
          type: string
          description: Format pipa, baris pertama judul kolom.
          examples: ["Size / Ukuran | Width / Lebar Badan | Length / Panjang Badan | Sleeve / Panjang Lengan | Height* / Tinggi Badan\nS | 48 | 66 | 21 | < 160\nM | 51 | 68.5 | 22 | 160-170\nL | 54 | 71 | 23 | 170-180\nXL | 57 | 73.5 | 24 | 180-190\nXXL | 60 | 76 | 25 | > 190"]
        note:
          type: string
          examples: ["All measurements in cm. Tolerance 1-2 cm.\n*Height is a recommendation only. Compare with the measurements above for your best fit."]
        updated_at: { type: string, format: date-time }
    InquiryKind:
      type: string
      enum: [wholesale, collaboration]
    InquiryStatus:
      type: string
      enum: [new, contacted, done, spam]
    InquiryInput:
      type: object
      required: [kind, name, org, city, message, consent]
      description: Isi `phone` atau `email`, minimal salah satu. Spasi di awal dan akhir dibuang.
      properties:
        kind: { $ref: '#/components/schemas/InquiryKind' }
        name: { type: string, minLength: 2, maxLength: 80 }
        org: { type: string, minLength: 2, maxLength: 120 }
        city: { type: string, minLength: 2, maxLength: 80 }
        phone:
          type: string
          description: Diawali 08 atau +62, 10 sampai 15 digit. Spasi, tanda hubung, titik, dan kurung dibuang.
        email: { type: string, format: email, maxLength: 254 }
        channels: { type: string, maxLength: 200 }
        techs:
          type: array
          maxItems: 20
          items: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
          examples: [[aezy]]
        quantity_note: { type: string, maxLength: 200 }
        message: { type: string, minLength: 10, maxLength: 1000 }
        consent: { type: boolean, const: true }
        website:
          type: string
          description: Honeypot. Dibiarkan kosong oleh manusia.
    InquiryCreated:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^B2B-[0-9A-HJKMNP-TV-Z]{6}$'
          description: Kode untuk dikutip pengirim saat menghubungi NVM.
    Inquiry:
      type: object
      description: Tanpa hash IP dan Idempotency-Key.
      required: [id, code, kind, name, org, city, phone, email, channels, techs, quantity_note, message, consent_at, status, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^B2B-[0-9A-HJKMNP-TV-Z]{6}$' }
        kind: { $ref: '#/components/schemas/InquiryKind' }
        name: { type: string }
        org: { type: string }
        city: { type: string }
        phone: { type: string }
        email: { type: string }
        channels: { type: string }
        techs:
          type: array
          items: { type: string }
        quantity_note: { type: string }
        message: { type: string }
        consent_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, action, entity, entity_id, at, username]
      properties:
        id: { type: integer }
        action: { type: string, enum: [create, update, save, delete] }
        entity:
          type: string
          description: Segmen pertama path admin, contoh `techs`, `collabs`, `settings`.
        entity_id: { type: string }
        at: { type: string, format: date-time }
        username:
          type: [string, 'null']
          description: Null bila user admin sudah dihapus.
    GateSetting:
      type: object
      required: [enabled, updated_at, updated_by]
      properties:
        enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
