    put:
      tags: [Admin konten]
      summary: Buat atau ganti size chart
      description: |
        `rows` memakai format pipa: satu baris judul lalu minimal satu baris ukuran, jumlah kolom
        sama. Rentang boleh memakai `-` atau `–`, juga `<` dan `>`.
