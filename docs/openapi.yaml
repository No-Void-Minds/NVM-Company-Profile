        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rows]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                rows: { type: string }
                note: { type: string, maxLength: 1000 }
            example:
              title: AEZY Regular T-Shirt
              rows: "Size / Ukuran | Width / Lebar Badan | Length / Panjang Badan | Sleeve / Panjang Lengan | Height* / Tinggi Badan\nS | 48 | 66 | 21 | < 160\nM | 51 | 68.5 | 22 | 160-170\nL | 54 | 71 | 23 | 170-180\nXL | 57 | 73.5 | 24 | 180-190\nXXL | 60 | 76 | 25 | > 190"
              note: "All measurements in cm. Tolerance 1-2 cm.\n*Height is a recommendation only. Compare with the measurements above for your best fit."
      responses:
        '200':
          description: Size chart setelah disimpan.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizeChart' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [Admin konten]
      summary: Hapus size chart
      operationId: adminDeleteSizeChart
      security: [{ session: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/SizeChartKey'
      responses:
        '204':
          description: Terhapus.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

