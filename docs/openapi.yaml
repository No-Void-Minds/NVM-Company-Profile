openapi: 3.1.0
info:
  title: API Company Profile No Void Minds
  version: 1.0.0
  description: |
    Kontrak backend dan frontend company profile NVM (SRS 7.4). Spec ini diuji terhadap router Gin
    oleh `backend/internal/httpapi/openapi_test.go`: route yang tidak tercatat di sini, atau
    sebaliknya, membuat `check.sh` gagal.

    ## Format error

    Setiap error dari backend berbentuk `{"error":{"code","message","fields"}}` dengan
    `Cache-Control: no-store`. `fields` hanya ada bila error menyangkut isian tertentu,
    kuncinya nama field (contoh `phone`, `links.Regular`).

    | Kode | Status | Arti |
    |---|---|---|
    | `VALIDATION` | 400 | Isian atau parameter tidak valid |
    | `UNAUTHORIZED` | 401 | Belum masuk, sesi habis, password salah, atau situs dikunci |
    | `FORBIDDEN` | 403 | Header `X-CSRF-Token` tidak cocok |
    | `NOT_FOUND` | 404 | Data atau alamat tidak ada |
    | `CONFLICT` | 409 | Aturan bisnis menolak (testimoni tayang tanpa konfirmasi blur) |
    | `RATE_LIMITED` | 429 | Batas permintaan terlampaui |
    | `INTERNAL` | 500 | Kesalahan server, detail hanya di log |

    ## Autentikasi admin

    `POST /api/admin/login` memasang cookie sesi `nvm_compro_sid` (HttpOnly, SameSite=Lax,
    Secure bila `COOKIE_SECURE=true`, berlaku 8 jam sejak aktivitas terakhir) dan mengembalikan
    `csrf_token`. Setiap mutasi admin (POST, PUT, PATCH, DELETE di bawah `/api/admin/`, kecuali
    login) wajib mengirim token itu di header `X-CSRF-Token`. `GET /api/admin/me` mengembalikan
    token yang sama setelah halaman dimuat ulang.

    ## Batas permintaan

    Disimpan di memori backend, hilang saat restart.

    - `POST /api/inquiries`: 5 kiriman baru per jam per IP. Mengulang kiriman dengan
      `Idempotency-Key` yang sudah tersimpan tidak menghabiskan kuota.
    - `POST /api/admin/login`: 10 percobaan per 15 menit per IP.

    Bila terlampaui, jawabannya 429 dengan kode `RATE_LIMITED`, tanpa header `Retry-After`.

    ## Halaman password

    Saat halaman password aktif (`PUT /api/admin/settings/password-gate`), Nginx memeriksa
    `GET /api/gate` sebelum meneruskan request ke `/api/*` (kecuali `/api/health`, `/api/gate`,
    dan `/api/admin/*`) dan `/media/*`. Tanpa sesi admin, Nginx sendiri menjawab 401
    `{"error":{"code":"UNAUTHORIZED","message":"Situs sedang dikunci."}}` dengan
    `Cache-Control: private, no-store` dan `X-Robots-Tag: noindex`. Request ke backend langsung
    (dev, port 8082) tidak melewati pemeriksaan ini. Dengan sesi admin, request diteruskan dan
    backend menandai jawabannya `private, no-store` serta `noindex`.

    ## Cache

    - API publik: `Cache-Control: public, max-age=60`, menjadi `private, no-store` saat situs dikunci.
    - Semua `/api/admin/*`, termasuk login: `no-store`.
    - Semua jawaban error: `no-store`.
    - `/sitemap.xml` dan `/robots.txt`: `public, max-age=3600`. `/media/*`: satu tahun, immutable.
  license:
    name: Proprietary
servers:
  - url: https://novoidminds.id
    description: Produksi (lewat Nginx dan halaman password)
  - url: http://127.0.0.1:8082
    description: Backend dev di laptop
tags:
  - name: Publik
    description: Data untuk halaman publik, dua bahasa lewat `?lang=id|en`.
  - name: Inquiry
    description: Formulir B2B wholesale dan kolaborasi.
  - name: Situs
    description: Health, gate untuk Nginx, sitemap, robots, dan gambar.
  - name: Admin sesi
  - name: Admin konten
  - name: Admin inquiry
  - name: Admin pengaturan
  - name: Dev
    description: Hanya terdaftar bila `GIN_MODE=debug`. Di mode release jawabannya 404.

paths:
  /api/health:
    get:
      tags: [Situs]
      summary: Status backend dan koneksi database
      operationId: health
      responses:
        '200':
          description: Backend dan database sehat.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database tidak bisa dihubungi dalam 3 detik.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/gate:
    get:
      tags: [Situs]
      summary: Pemeriksaan halaman password untuk Nginx auth_request
      description: |
        204 meneruskan request, 401 menampilkan halaman password. Sesi admin membuka situs yang
        terkunci untuk browser itu. Bila status tidak terbaca dari database, situs dianggap terkunci.
      operationId: checkGate
      parameters:
        - $ref: '#/components/parameters/SessionCookieOptional'
      responses:
        '204':
          description: Situs terbuka, atau terkunci tetapi ada sesi admin.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Gate: { $ref: '#/components/headers/XGate' }
        '401':
          description: Situs terkunci dan tidak ada sesi admin. Tanpa body.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Gate: { $ref: '#/components/headers/XGate' }

  /sitemap.xml:
    get:
      tags: [Situs]
      summary: Sitemap semua route publik dalam dua bahasa
      description: Alamat memakai `PUBLIC_BASE_URL`. Saat situs dikunci jawabannya 404.
      operationId: sitemap
      responses:
        '200':
          description: Sitemap dengan hreflang id, en, dan x-default.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'public, max-age=3600' }
          content:
            application/xml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /robots.txt:
    get:
      tags: [Situs]
      summary: robots.txt yang mengikuti halaman password
      description: Saat terbuka melarang `/admin` dan menyebut sitemap. Saat terkunci melarang semuanya.
      operationId: robots
      responses:
        '200':
          description: Isi robots.txt.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: ['public, max-age=3600', 'no-store']
          content:
            text/plain:
              schema: { type: string }

  /media/{name}:
    get:
      tags: [Situs]
      summary: Gambar hasil unggahan (WebP)
      description: Setiap unggahan disimpan dalam tiga lebar, 480, 960, dan 1600 px.
      operationId: serveMedia
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-(480|960|1600)\.webp$'
      responses:
        '200':
          description: File gambar.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: ['public, max-age=31536000, immutable', 'private, no-store']
          content:
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/techs:
    get:
      tags: [Publik]
      summary: Daftar material system yang tampil di situs
      description: Tech dengan `visible=false` (FR-134) tidak ikut. Teks mengikuti `lang`, kembali ke teks asli bila terjemahan belum ada.
      operationId: listTechs
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Tech urut `sort`, lengkap dengan link Shopee per fit.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tech' }
              example:
                - key: aezy
                  name: AEZY
                  family: AEZY
                  generation: 1
                  needs: [hot]
                  tagline: Untuk hari-hari yang terasa gerah.
                  sub: Performa, iklim, stretch
                  description: Kain performa yang ringan. Bernapas, cepat kering, dan lembut seperti udara. Direkayasa untuk bergerak dan menjaga kenyamanan di iklim sehari-hari, dengan pemulihan elastis yang tetap stabil setelah lama dipakai.
                  chips: [Bernapas, Cepat kering, Lembut seperti udara, Pemulihan elastis]
                  fits: [Regular, Fitted, Polo]
                  technology_label: Air feel technology
                  on_rack: false
                  visible: true
                  sort: 1
                  links:
                    - fit: Regular
                      url: https://shopee.co.id/No-Void-Minds-AEZY-Regular-T-Shirt-Core-i.462123491.25438116155
                    - fit: Polo
                      url: https://shopee.co.id/No-Void-Minds-AEZY-Polo-Shirt-Core-i.462123491.41081865803
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/collabs:
    get:
      tags: [Publik]
      summary: Daftar koleksi collab
      operationId: listCollabs
      responses:
        '200':
          description: Collab urut `sort`.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Collab' }
        '401': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/lab-stats:
    get:
      tags: [Publik]
      summary: Angka untuk Lab index dan teks "N material system"
      operationId: labStats
      responses:
        '200':
          description: Jumlah tech yang tampil, yang on the rack, dan tahun berdiri.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabStats' }
        '401': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/gallery:
    get:
      tags: [Publik]
      summary: Foto galeri yang tampil
      description: Alt dan keterangan mengikuti `lang`. Teks Inggris yang kosong diganti teks Indonesia.
      operationId: listGallery
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: category
          in: query
          description: Hanya kategori ini. Kosong berarti semua.
          schema: { type: string }
      responses:
        '200':
          description: Foto urut `sort`.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GalleryItem' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/testimonials:
    get:
      tags: [Publik]
      summary: Testimoni yang sudah tayang
      description: Transkrip tidak diterjemahkan, bahasanya ada di field `lang`.
      operationId: listTestimonials
      parameters:
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/TestimonialSource' }
        - name: tech
          in: query
          description: Key tech, contoh `aezy`.
          schema: { type: string }
      responses:
        '200':
          description: Testimoni terbaru dulu.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Testimonial' }
        '401': { $ref: '#/components/responses/Locked' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/size-charts/{key}:
    get:
      tags: [Publik]
      summary: Size chart satu kombinasi tech dan fit
      operationId: getSizeChart
      parameters:
        - $ref: '#/components/parameters/SizeChartKey'
      responses:
        '200':
          description: Size chart.
          headers:
            Cache-Control: { $ref: '#/components/headers/PublicCache' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SizeChart' }
        '401': { $ref: '#/components/responses/Locked' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/inquiries:
    post:
      tags: [Inquiry]
      summary: Kirim inquiry wholesale atau kolaborasi
      description: |
        Mengirim ulang dengan `Idempotency-Key` yang sama mengembalikan kode yang sudah tersimpan,
        tanpa menyimpan baris baru dan tanpa menghabiskan kuota. Field `website` adalah honeypot:
        bila terisi, backend menjawab 201 dengan kode acak tanpa menyimpan apa pun.
      operationId: createInquiry
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryInput' }
      responses:
        '201':
          description: Tersimpan, atau kiriman ulang dari key yang sama.
          headers:
            Cache-Control:
              description: Hanya ada saat situs dikunci.
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryCreated' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/login:
    post:
      tags: [Admin sesi]
      summary: Masuk admin
      description: Memasang cookie `nvm_compro_sid`. Batas 10 percobaan per 15 menit per IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Berhasil masuk.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie:
              description: '`nvm_compro_sid=<token>; Path=/; Max-Age=28800; HttpOnly; SameSite=Lax`, ditambah `Secure` di produksi.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/me:
    get:
      tags: [Admin sesi]
      summary: Sesi yang sedang aktif
      operationId: me
      security: [{ session: [] }]
      responses:
        '200':
          description: Username dan token CSRF sesi ini.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/logout:
    post:
      tags: [Admin sesi]
      summary: Keluar admin
      description: Menghapus sesi di database dan cookie di browser.
      operationId: logout
      security: [{ session: [], csrf: [] }]
      responses:
        '204':
          description: Sesi dihapus.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/techs:
    get:
      tags: [Admin konten]
      summary: Semua tech, termasuk yang disembunyikan
      description: Bentuk sama dengan `/api/techs`, tanpa cache, sehingga perubahan langsung terlihat.
      operationId: adminListTechs
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Tech urut `sort`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tech' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/techs/{key}:
    patch:
      tags: [Admin konten]
      summary: Ubah on the rack, tampil di situs, atau link Shopee satu tech
      description: |
        Hanya field yang dikirim yang berubah, minimal satu. `links` mengganti semua link tech itu.
        Link kosong berarti tanpa link. Tech yang punya fit wajib memakai link per fit, tech tanpa
        fit memakai satu link dengan `fit: null`. Error per link memakai kunci `links.<fit>` atau `links`.
      operationId: adminPatchTech
      security: [{ session: [], csrf: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, examples: [aezy] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                on_rack: { type: boolean }
                visible: { type: boolean }
                links:
                  type: array
                  items: { $ref: '#/components/schemas/TechLink' }
            example:
              links:
                - fit: Regular
                  url: https://shopee.co.id/No-Void-Minds-AEZY-Regular-T-Shirt-Core-i.462123491.25438116155
                - fit: Polo
                  url: https://shopee.co.id/No-Void-Minds-AEZY-Polo-Shirt-Core-i.462123491.41081865803
      responses:
        '200':
          description: Tech setelah disimpan, dalam bahasa Indonesia.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tech' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/collabs:
    get:
      tags: [Admin konten]
      summary: Semua collab, tanpa cache
      operationId: adminListCollabs
      security: [{ session: [] }]
      responses:
        '200':
          description: Collab urut `sort`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Collab' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/collabs/{key}:
    patch:
      tags: [Admin konten]
      summary: Ubah status atau link koleksi Shopee satu collab
      description: Minimal satu field. `url` kosong menghapus link. Link hanya boleh ke `https://shopee.co.id`.
      operationId: adminPatchCollab
      security: [{ session: [], csrf: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                available: { type: boolean }
                url: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Collab setelah disimpan.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collab' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/gallery:
    get:
      tags: [Admin konten]
      summary: Semua foto galeri, termasuk yang disembunyikan
      operationId: adminListGallery
      security: [{ session: [] }]
      responses:
        '200':
          description: Foto urut `sort`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminGalleryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [Admin konten]
      summary: Unggah foto galeri
      description: JPG, PNG, atau WebP, maksimal 8 MB. Disimpan sebagai WebP 480, 960, dan 1600 px.
      operationId: adminCreateGallery
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, category, alt]
              properties:
                image: { type: string, contentMediaType: application/octet-stream }
                category: { type: string, minLength: 1, maxLength: 60 }
                alt: { type: string, minLength: 1, maxLength: 300 }
                caption: { type: string, maxLength: 300 }
                alt_en: { type: string, maxLength: 300 }
                caption_en: { type: string, maxLength: 300 }
                visible: { type: boolean, default: true }
                sort: { type: integer, default: 0 }
      responses:
        '201':
          description: Foto tersimpan.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGalleryItem' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/admin/gallery/{id}:
    patch:
      tags: [Admin konten]
      summary: Ubah teks, urutan, atau status tampil foto galeri
      description: Field yang tidak dikirim tetap. Gambar tidak bisa diganti, unggah foto baru.
      operationId: adminUpdateGallery
      security: [{ session: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string, minLength: 1, maxLength: 60 }
                alt: { type: string, minLength: 1, maxLength: 300 }
                caption: { type: string, maxLength: 300 }
                alt_en: { type: string, maxLength: 300 }
                caption_en: { type: string, maxLength: 300 }
                visible: { type: boolean }
                sort: { type: integer }
      responses:
        '200':
          description: Foto setelah disimpan.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGalleryItem' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      tags: [Admin konten]
